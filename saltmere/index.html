<style>
/* Layout: full-bleed canvas platformer; chapter cards sit over it like letters laid on a wet table */

[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; background: var(--night); color: var(--paper); overflow: hidden; }
body { font-family: var(--body); font-size: 17px; }
#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; background: var(--night); }
#screen {
  position: fixed; inset: 0; display: grid; place-items: center; overflow-y: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px;
  background: rgba(10, 14, 26, .72);
}
.letter {
  width: 100%; max-width: 36rem; box-sizing: border-box;
  display: flex; flex-direction: column; gap: 14px;
  background: var(--paper); color: var(--ink);
  padding: 28px clamp(18px, 5vw, 36px) 26px;
  border-radius: 2px;
  box-shadow: 0 18px 50px rgba(0, 0, 0, .55);
  position: relative;
  background-image:
    repeating-linear-gradient(135deg, var(--mail) 0 12px, var(--paper) 12px 20px, #2f4f8a 20px 32px, var(--paper) 32px 40px);
  background-size: 100% 8px;
  background-repeat: no-repeat;
  background-position: top left;
}
.letter::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 8px;
  background: repeating-linear-gradient(135deg, var(--mail) 0 12px, var(--paper) 12px 20px, #2f4f8a 20px 32px, var(--paper) 32px 40px);
}
.postmark {
  font-family: var(--display); font-size: .82rem; letter-spacing: .12em; text-transform: uppercase;
  color: var(--mail); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
}
h1, h2 { font-family: var(--display); font-weight: 600; margin: 0; line-height: 1.02; text-wrap: balance; color: var(--ink); }
h1 { font-size: clamp(2.6rem, 10vw, 4.2rem); }
h2 { font-size: clamp(1.8rem, 7vw, 2.6rem); }
p { margin: 0; line-height: 1.55; max-width: 62ch; }
p.quiet { color: #6b6474; font-size: .95rem; }
p.sign { font-style: italic; }
.controls { display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; margin: 0; font-size: .95rem; color: #4e4858; }
.controls dt { font-family: var(--display); color: var(--ink); }
.controls dd { margin: 0; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; padding-block: 10px; border-block: 1px dashed rgba(42, 36, 51, .3); }
.stats div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stats span { font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; color: #6b6474; }
.stats b { font-family: var(--display); font-weight: 600; font-size: 1.5rem; font-variant-numeric: tabular-nums; color: var(--mail); }
.row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px; }
button {
  font: inherit; font-family: var(--display); font-size: 1.1rem; letter-spacing: .03em;
  padding: 11px 20px; cursor: pointer; border-radius: 2px;
  color: var(--paper); background: var(--mail); border: 2px solid var(--ink);
  box-shadow: 3px 3px 0 var(--ink);
  transition: transform .1s ease, box-shadow .1s ease;
}
button:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--ink); }
button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
button.ghost { background: transparent; color: var(--ink); }
button:focus-visible { outline: 3px solid #2f4f8a; outline-offset: 3px; }
@media (prefers-reduced-motion: reduce) { button { transition: none; } }

function builder(w, h) {
  const g = []; for (let y = 0; y < h; y++) g.push(new Array(w).fill(' '));

    w, h, g, ents: [], triggers: [], start: [2, 2],
    rect(x1, y1, x2, y2, ch = '#') { for (let y = y1; y <= y2; y++) for (let x = x1; x <= x2; x++) if (x >= 0 && y >= 0 && x < w && y < h) g[y][x] = ch; return b; },
    ground(x1, x2, top, ch = '#') { return b.rect(x1, top, x2, h - 1, ch); },
    plank(x1, x2, y) { return b.rect(x1, y, x2, y, '='); },
    spikes(x1, x2, y) { return b.rect(x1, y, x2, y, '^'); },
    water(x1, x2, top) { return b.rect(x1, top, x2, h - 1, '~'); },
    ent(type, tx, ty, o = {}) { b.ents.push(Object.assign({ type, tx, ty }, o)); return b; },
    say(trig, lines, o = {}) { b.triggers.push(Object.assign({ lines, done: false }, typeof trig === 'number' ? { x: trig } : trig, o)); return b; },
  };
  return b;
}

// ============================================================
// Canvas
// ============================================================
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
let VW = 0, VH = 0, DPR = 1, SCALE = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  VW = innerWidth; VH = innerHeight;
  cv.width = Math.round(VW * DPR); cv.height = Math.round(VH * DPR);
  SCALE = Math.max(.7, Math.min(VH / 390, VW / 540));
}
addEventListener('resize', resize);

// ============================================================
// Audio
// ============================================================
let AC = null, master = null, muted = false;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = .6; master.connect(AC.destination);
  } catch (e) { AC = null; }
}
function tone(freq, dur, type = 'square', vol = .06, slide = 0, delay = 0) {
  if (!AC || muted) return;
  const t0 = AC.currentTime + delay;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, t0 + dur);
  g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vol, t0 + .008);
  g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + dur + .05);
}
function noise(dur, vol = .12, freq = 800) {
  if (!AC || muted) return;
  const len = Math.floor(AC.sampleRate * dur), buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  f.type = 'bandpass'; f.frequency.value = freq; g.gain.value = vol;
  s.buffer = buf; s.connect(f); f.connect(g); g.connect(master); s.start();
}
const sfx = {
  jump() { tone(330, .12, 'square', .04, 520); },
  dj() { tone(520, .12, 'square', .04, 880); },
  stomp() { tone(220, .12, 'square', .06, 90); noise(.08, .08, 1200); },
  stamp() { tone(988, .08, 'square', .04); tone(1319, .14, 'square', .04, 0, .07); },
  hurt() { tone(200, .3, 'sawtooth', .07, 60); },
  splash() { noise(.4, .18, 500); tone(400, .3, 'sine', .05, 120); },
  mail() { [523, 659, 784].forEach((f, i) => tone(f, .18, 'triangle', .06, 0, i * .07)); },
  spring() { tone(200, .25, 'triangle', .08, 900); },
  blip() { tone(rand(600, 760), .03, 'square', .015); },
  boom() { noise(.6, .3, 160); tone(90, .5, 'sawtooth', .08, 40); },
  bossHit() { tone(160, .4, 'square', .08, 50); noise(.3, .2, 400); },
  door() { [392, 494, 587, 784].forEach((f, i) => tone(f, .3, 'triangle', .06, 0, i * .09)); },
  give() { [523, 659, 784, 1047].forEach((f, i) => tone(f, .3, 'triangle', .06, 0, i * .1)); },
};
// tiny music box: one loop per chapter
const SONGS = [

// touch: left / right / jump buttons

function touchButtons() {

    jump: { x: VW - 70 - sr, y, r: 46 }, pause: { x: VW - 36 - sr, y: 34, r: 24 },

  runDialogLine();
}
function runDialogLine() {
  const l = dialog.lines[dialog.i];
  if (l && l[0] === 'give') {
    if (l[1] === 'dj') { hasDJ = true; sfx.give(); burst(P.x, P.y - 14, 30, '#e2b45a', 160, .8); }
    dialog.i++; return runDialogLine();
  }

}

// ============================================================
// Physics
// ============================================================
function moveX(e, dx) {
  e.x += dx;
  const l = e.x - e.w / 2, r = e.x + e.w / 2, t = e.y - e.h + 1, b = e.y - 1;
  for (let ty = Math.floor(t / T); ty <= Math.floor(b / T); ty++) {
    if (dx > 0 && isSolid(tile(Math.floor(r / T), ty))) { e.x = Math.floor(r / T) * T - e.w / 2 - .01; e.vx = 0; return true; }
    if (dx < 0 && isSolid(tile(Math.floor(l / T), ty))) { e.x = (Math.floor(l / T) + 1) * T + e.w / 2 + .01; e.vx = 0; return true; }
  }
  return false;
}
function moveY(e, dy, canDrop) {
  const prev = e.y; e.y += dy;
  const l = e.x - e.w / 2 + 1, r = e.x + e.w / 2 - 1;
  if (dy > 0) {
    const ty = Math.floor(e.y / T);
    for (let tx = Math.floor(l / T); tx <= Math.floor(r / T); tx++) {
      const c = tile(tx, ty);
      if (isSolid(c) || (c === '=' && prev <= ty * T + .5 && !canDrop)) { e.y = ty * T; e.vy = 0; return 'down'; }
    }
  } else if (dy < 0) {
    const ty = Math.floor((e.y - e.h) / T);
    for (let tx = Math.floor(l / T); tx <= Math.floor(r / T); tx++) {
      if (isSolid(tile(tx, ty))) { e.y = (ty + 1) * T + e.h; e.vy = 0; return 'up'; }
    }
  }
  return null;
}
function overlap(a, b) {
  return Math.abs(a.x - b.x) * 2 < a.w + b.w && a.y - a.h < b.y && b.y - b.h < a.y;
}

function burst(x, y, n, color, sp = 120, life = .6, grav = 300, size = 3) {
  for (let i = 0; i < n; i++) {
    const a = rand(Math.PI * 2), s = rand(sp * .3, sp);
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 40, life: rand(life * .5, life), max: life, color, grav, size: rand(size * .5, size) });
  }
}

function hurt(fromX) {
  if (P.inv > 0) return;
  P.hp--; P.inv = 1.2; shake = 6; sfx.hurt();
  P.vy = -380; P.vx = (P.x < fromX ? -1 : 1) * 260;
  burst(P.x, P.y - 12, 14, '#7fd1c7', 140, .5);
  if (P.hp <= 0) shortCircuit();
}
function shortCircuit() {
  deaths++;
  burst(P.x, P.y - 12, 40, '#e2b45a', 220, .9);
  noise(.5, .2, 2000);
  P.x = checkpoint.x; P.y = checkpoint.y; P.vx = P.vy = 0; P.hp = 3; P.inv = 1.5; P.plat = null;
  P.safe = { x: P.x, y: P.y };
  if (boss && boss.hp > 0) resetBoss();

}
function fellIn(splash) {

  P.hp--; deaths += P.hp <= 0 ? 0 : 0;

  rocks = [];

// ============================================================
// Update
// ============================================================
function update(dt) {
  now += dt; playTime += dt;
  const ts = touch.used ? touchState() : {};
  const left = keys.KeyA || keys.ArrowLeft || ts.left, right = keys.KeyD || keys.ArrowRight || ts.right;
  const down = keys.KeyS || keys.ArrowDown;
  const jumpIsHeld = jumpHeld || ts.jump;

  // platforms
  for (const p of plats) {
    p.ph += dt * p.speed;
    const nx = p.ox + (p.axis === 'x' ? Math.sin(p.ph) * p.range : 0);
    const ny = p.oy + (p.axis === 'y' ? Math.sin(p.ph) * p.range : 0);
    p.dx = nx - p.x; p.dy = ny - p.y; p.x = nx; p.y = ny;
  }
  if (P.plat) {
    const p = P.plat;
    if (P.x + P.w / 2 > p.x && P.x - P.w / 2 < p.x + p.w) { P.x += p.dx; P.y = p.y; moveX(P, 0); }
    else P.plat = null;
  }

  // horizontal
  const dir = (right ? 1 : 0) - (left ? 1 : 0);
  const RUN = 225, acc = P.ground ? 2400 : 1500;
  if (dir) { P.vx += dir * acc * dt; P.f = dir; }
  else { const fr = (P.ground ? 2200 : 700) * dt; P.vx = Math.abs(P.vx) <= fr ? 0 : P.vx - Math.sign(P.vx) * fr; }
  P.vx = clamp(P.vx, -RUN, RUN);

    if (P.coyote > 0) { P.vy = -640; P.coyote = 0; P.buffer = 0; P.ground = false; P.plat = null; sfx.jump(); P.squash = -.25; }
    else if (hasDJ && !P.usedDJ) { P.vy = -570; P.usedDJ = true; P.buffer = 0; sfx.dj(); burst(P.x, P.y, 10, '#e2b45a', 90, .4, 0, 2.5); }
  }
  const G = 1800;
  P.vy += G * dt * (!jumpIsHeld && P.vy < 0 ? 2.2 : 1);

  P.drop = Math.max(0, P.drop - dt);

  moveX(P, P.vx * dt);
  const wasGround = P.ground;
  const prevY = P.y;
  const res = moveY(P, P.vy * dt, P.drop > 0);
  P.ground = res === 'down';

  if (P.ground) {
    if (!wasGround) { P.squash = .25; if (P.vy === 0) burst(P.x, P.y, 4, 'rgba(220,220,230,.6)', 50, .25, 0, 2); }
    P.usedDJ = false;
    if (!P.plat && supported(P.x - P.w / 2 + 2) && supported(P.x + P.w / 2 - 2)) P.safe = { x: P.x, y: P.y };
  }
  P.squash *= Math.pow(.001, dt);
  P.walk += Math.abs(P.vx) * dt * .06;

  // hazards
  const cx = Math.floor(P.x / T);

  else if (P.y > lvl.h * T + 40) { fellIn(false); }
  else {
    for (const ox of [-P.w / 2 + 3, P.w / 2 - 3]) {
      if (tile(Math.floor((P.x + ox) / T), Math.floor((P.y - 2) / T)) === '^') { hurt(P.x - P.f * 10); break; }
    }
  }

  // enemies
  for (const e of enemies) {
    if (!e.alive) continue;
    if (e.type === 'crab') {
      const ahead = e.x + Math.sign(e.vx) * (e.w / 2 + 1);
      const wall = isSolid(tile(Math.floor(ahead / T), Math.floor((e.y - 4) / T)));
      const belowC = tile(Math.floor(ahead / T), Math.floor((e.y + 2) / T));
      if (wall || !(isSolid(belowC) || belowC === '=')) e.vx *= -1;
      e.x += e.vx * dt;
    } else if (e.type === 'gull') {
      e.t += dt;
      const nx = e.ox + Math.sin(e.t * .9) * e.range;
      e.f = nx > e.x ? 1 : -1; e.x = nx; e.y = e.oy + Math.sin(e.t * 2.6) * 8;
    } else if (e.type === 'eel') {
      if (e.wait > 0) { e.wait -= dt; if (e.wait <= 0) { e.vy = -620; sfx.splash(); burst(e.x, e.base, 8, '#9cc4e8', 120, .5, 500); } }
      else { e.vy += G * dt; e.y += e.vy * dt; if (e.y >= e.base && e.vy > 0) { e.y = e.base; e.wait = rand(1.4, 2.4); } }
    }
    const visible = e.type !== 'eel' || e.wait <= 0;
    if (visible && P.inv <= 0 && overlap(P, e)) {
      const stompable = e.type !== 'eel';
      if (stompable && P.vy > 0 && P.y - e.y + e.h < 14) {
        e.alive = false; sfx.stomp(); P.vy = jumpIsHeld ? -560 : -380; P.usedDJ = false;
        burst(e.x, e.y - 6, 14, e.type === 'crab' ? '#c9643f' : e.bat ? '#5a4a6a' : '#e8e4da', 140, .5);
      } else hurt(e.x);
    }
  }

  // stamps
  for (const s of stamps) {
    if (s.got) continue;
    if (Math.abs(P.x - s.x) < 18 && P.y - P.h - 10 < s.y && P.y + 6 > s.y) {
      s.got = true; collected.add(s.id); sfx.stamp(); burst(s.x, s.y, 16, '#d6453d', 120, .5, 100, 2.5);
    }
  }

  // props
  for (const pr of props) {
    if (pr.type === 'mailbox' && !pr.on && Math.abs(P.x - pr.x) < 22 && Math.abs(P.y - pr.y) < 30) {
      for (const o of props) if (o.type === 'mailbox') o.on = false;
      pr.on = true; checkpoint = { x: pr.x, y: pr.y }; P.hp = 3; sfx.mail(); burst(pr.x, pr.y - 30, 12, '#e2b45a', 100, .5);
    }
    if (pr.type === 'spring') {
      pr.sq = Math.max(0, pr.sq - dt * 4);
      if (P.vy >= 0 && Math.abs(P.x - pr.x) < 16 && P.y >= pr.y - 14 && P.y <= pr.y + 2 && (P.ground || P.vy > 0)) {
        P.vy = -980; P.y = pr.y - 14; P.ground = false; P.plat = null; P.usedDJ = false; pr.sq = 1; sfx.spring();
      }
    }
    if (pr.type === 'door' && Math.abs(P.x - pr.x) < 14 && Math.abs(P.y - pr.y) < 10) {
      sfx.door(); finishChapter(); return;
    }
    if (pr.type === 'spark' && Math.abs(P.x - pr.x) < 18 && Math.abs(P.y - pr.y) < 30) {
      sfx.give(); burst(pr.x, pr.y - 16, 40, '#9fe8ff', 200, .9);
      props = props.filter(o => o !== pr);
      startDialog([
        ['sys', 'You took the spark coil. It hums against your satchel like a held breath.'],
        ['hour', '(far below) TICK. TOCK. Well done, courier.'],
      ], finishChapter);
      return;
    }
    if (pr.type === 'lighthouse' && Math.abs(P.x - pr.x) < 20 && P.ground && endingTimer < 0 && (!boss || boss.hp <= 0)) {
      endingTimer = 0;
      startDialog([
        ['odile', 'Who\'s there? ...A courier? Now? The town\'s gone, little machine.'],
        ['pip', 'One letter, ma\'am. For Odile Fenn, Keeper, Saltmere Light.'],
        ['odile', 'That\'s... that\'s Ness\'s handwriting.'],
        ['odile', '"Mum. I\'m on the last ferry. I\'m coming back to get you. Keep the light on."'],
        ['odile', 'Three nights I let it go dark. I thought there was nobody left out there to see it.'],
        ['pip', 'There is. And I brought a spark.'],
        ['act', () => { lampLit = .01; sfx.give(); shake = 6; }],
        ['sys', 'The Saltmere Light wakes up.'],
      ], () => { endingTimer = 0.01; });
      return;
    }
  }

  // triggers
  for (const tr of lvl.triggers) {
    if (tr.done) continue;
    let hit;
    if (tr.y === undefined) hit = P.x / T >= tr.x;
    else hit = Math.abs(P.x / T - tr.x - .5) <= 2.5 && Math.abs(P.y / T - tr.y - 1) <= 2.5;
    if (hit) { tr.done = true; startDialog(tr.lines); return; }
  }

  // boss arena
  if (boss) updateBoss(dt);

  // ending sequence after lamp
  if (lampLit > 0) lampLit += dt;
  if (endingTimer > 0) { endingTimer += dt; if (endingTimer > 3.2) { showEnding(); return; } }

  // particles
  for (const q of particles) { q.vy += q.grav * dt; q.x += q.vx * dt; q.y += q.vy * dt; q.life -= dt; }
  particles = particles.filter(q => q.life > 0);

  // camera
  const vw = viewW(), vh = viewH();
  const tx = P.x - vw / 2 + P.f * vw * .08, ty = P.y - vh * (chapter === 4 && P.x > 54 * T ? .82 : .58);
  cam.x += (tx - cam.x) * Math.min(1, dt * 5);
  cam.y += (ty - cam.y) * Math.min(1, dt * 4);
  clampCam();
  shake = Math.max(0, shake - dt * 20);
}

function supported(px) {
  const c = tile(Math.floor(px / T), Math.floor((P.y + 2) / T));
  return isSolid(c) || c === '=';
}
function onPlank() {
  const c1 = tile(Math.floor((P.x - P.w / 2 + 2) / T), Math.floor((P.y + 2) / T));
  const c2 = tile(Math.floor((P.x + P.w / 2 - 2) / T), Math.floor((P.y + 2) / T));
  return (c1 === '=' || c1 === ' ') && (c2 === '=' || c2 === ' ') && (c1 === '=' || c2 === '=');
}

function updateBoss(dt) {
  const B = boss;
  B.flash = Math.max(0, B.flash - dt);
  if (B.state === 'sleep') {
    if (P.x / T >= 24) {
      for (let y = 0; y <= 11; y++) setTile(21, y, '#');
      gateClosed = true; B.state = 'idle'; B.t = 1.2; sfx.boom(); shake = 10;
      if (!B.introduced) {
        B.introduced = true;
        startDialog([
          ['dredger', 'CLEARING HARBOUR. OBSTRUCTION DETECTED.'],
          ['pip', 'I\'m not an obstruction. I\'m the post.'],
          ['dredger', 'OBSTRUCTION. WILL. BE. CLEARED.'],
          ['sys', 'Dodge its charge. When it hits a wall it stalls. Jump on its head then.'],
        ]);
      }
    }
    return;
  }
  if (B.state === 'dead') {
    B.t += dt;
    if (Math.random() < dt * 8) burst(B.x + rand(-40, 40), B.y - rand(10, 60), 3, '#888', 60, 1, -40, 4);
    return;
  }
  B.t -= dt;
  const minX = 22 * T + B.w / 2, maxX = 53 * T - B.w / 2;
  if (B.state === 'idle') {
    B.dir = P.x < B.x ? -1 : 1;
    if (B.t <= 0) { B.state = 'wind'; B.t = .75 - (3 - B.hp) * .12; }
  } else if (B.state === 'wind') {
    if (Math.random() < dt * 30) burst(B.x - B.dir * 40, B.y - 4, 2, 'rgba(200,200,210,.6)', 60, .5, -60, 4);
    if (B.t <= 0) { B.state = 'charge'; B.vx = B.dir * (340 + (3 - B.hp) * 50); }
  } else if (B.state === 'charge') {
    B.x += B.vx * dt;
    if (Math.random() < dt * 20) burst(B.x - B.dir * 44, B.y, 1, 'rgba(160,150,140,.6)', 40, .4, 0, 4);
    if (B.x <= minX || B.x >= maxX) {
      B.x = clamp(B.x, minX, maxX);
      B.state = 'stun'; B.t = 2.4; B.vx = 0; sfx.boom(); shake = 14;
      burst(B.x + B.dir * 46, B.y - 30, 30, '#8a8478', 220, .8, 500, 5);
      const n = 2 + (3 - B.hp);
      for (let i = 0; i < n; i++) rocks.push({ x: rand(23 * T, 52 * T), y: -20 - i * 60, vy: 0, warn: .7 + i * .25, w: 18, h: 18 });
    }
  } else if (B.state === 'stun') {
    if (B.t <= 0) { B.state = 'idle'; B.t = .9; }
  } else if (B.state === 'hurt') {
    if (B.t <= 0) { B.state = 'idle'; B.t = .6; }
  }
  // collisions with player
  const body = { x: B.x, y: B.y, w: B.w - 10, h: B.h - 6 };
  if (P.inv <= 0 && overlap(P, body)) {
    if (B.state === 'stun' && P.vy > 0 && P.y - (B.y - B.h) < 18) {
      B.hp--; B.flash = .4; P.vy = -620; P.usedDJ = false; sfx.bossHit(); shake = 12;
      burst(P.x, P.y, 26, '#f07a3e', 200, .7);
      if (B.hp <= 0) bossDefeated();
      else { B.state = 'hurt'; B.t = .7; }
    } else if (B.state !== 'stun' && B.state !== 'hurt') hurt(B.x);
  }
  // rocks
  for (const r of rocks) {
    if (r.warn > 0) { r.warn -= dt; continue; }
    r.vy += 1500 * dt; r.y += r.vy * dt;
    if (r.y >= 12 * T) { r.dead = true; burst(r.x, 12 * T - 4, 10, '#7d7468', 140, .5, 600, 4); noise(.15, .08, 300); }
    else if (P.inv <= 0 && overlap(P, r)) { r.dead = true; hurt(r.x); }
  }
  rocks = rocks.filter(r => !r.dead);
}

function bossDefeated() {
  boss.state = 'dead'; boss.t = 0; rocks = [];
  sfx.boom();
  startDialog([
    ['dredger', 'HARBOUR... CLEAR?'],
    ['pip', 'Clear enough. You can rest now.'],
    ['dredger', '...REST.'],
    ['act', () => {
      for (let y = 0; y <= 11; y++) setTile(53, y, ' ');
      burst(53 * T + 16, 8 * T, 60, '#8a8478', 260, 1, 600, 5); sfx.boom(); shake = 16;
      checkpoint = { x: 50 * T, y: 12 * T };
    }],
    ['wren', 'Ha! The tin can did it! Go on, the keeper\'s door is right there!'],
  ]);
}

// ============================================================
// Rendering
// ============================================================
function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.imageSmoothingEnabled = false;
  if (!lvl) { ctx.fillStyle = '#0e1424'; ctx.fillRect(0, 0, VW, VH); return; }
  const ch = CHAPTERS[chapter];
  // sky
  const g = ctx.createLinearGradient(0, 0, 0, VH);
  const sky = lampLit > 0 && chapter === 4 ? ['#24314f', '#5d5a7e', '#e7a77a'] : ch.sky;
  g.addColorStop(0, sky[0]); g.addColorStop(.6, sky[1]); g.addColorStop(1, sky[2]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);
  if (ch.bg === 'city' && !ch.dim) {
    // moon
    ctx.fillStyle = 'rgba(255,240,220,.18)'; ctx.beginPath(); ctx.arc(VW * .78 - cam.x * .03 * SCALE, VH * .2, 38 * SCALE, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,240,220,.5)'; ctx.beginPath(); ctx.arc(VW * .78 - cam.x * .03 * SCALE, VH * .2, 22 * SCALE, 0, 7); ctx.fill();
  }
  drawBackground();

  const sx = Math.round((cam.x + (shake ? rand(-shake, shake) : 0)) * SCALE) / SCALE;
  const sy = Math.round((cam.y + (shake ? rand(-shake, shake) : 0)) * SCALE) / SCALE;
  const k = DPR * SCALE;
  ctx.setTransform(k, 0, 0, k, -sx * k, -sy * k);

  // world-space backdrop props
  for (const pr of props) if (pr.type === 'lighthouse') drawLighthouse(pr);

  // water (animated, behind tiles edges)
  drawWater(sx, sy);
  ctx.drawImage(tileCache, 0, 0);

  for (const p of plats) drawPlat(p);
  for (const pr of props) drawProp(pr);
  for (const s of stamps) if (!s.got) drawStamp(s.x, s.y + Math.sin(now * 3 + s.ph) * 2);
  for (const e of enemies) if (e.alive) drawEnemy(e);
  if (boss) drawBoss(boss);
  for (const r of rocks) {
    if (r.warn > 0) { ctx.fillStyle = `rgba(240,90,60,${.3 + .3 * Math.sin(now * 20)})`; ctx.fillRect(r.x - 12, 12 * T - 4, 24, 4); }
    else { ctx.fillStyle = '#6f675c'; ctx.beginPath(); ctx.arc(r.x, r.y - 9, 10, 0, 7); ctx.fill(); ctx.fillStyle = '#8f8678'; ctx.fillRect(r.x - 5, r.y - 15, 5, 4); }
  }
  if (!(P.inv > 0 && Math.floor(now * 16) % 2)) drawPip(P.x, P.y, P.f, P.ground ? P.walk : 0, P.squash, !P.ground);
  for (const q of particles) {
    ctx.globalAlpha = clamp(q.life / q.max, 0, 1);
    ctx.fillStyle = q.color; ctx.fillRect(q.x - q.size / 2, q.y - q.size / 2, q.size, q.size);
  }
  ctx.globalAlpha = 1;

  // lighting for dim levels
  if (ch.dim) {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const px = (P.x - sx) * SCALE, py = (P.y - 14 - sy) * SCALE;
    const rg = ctx.createRadialGradient(px, py, 30 * SCALE, px, py, 260 * SCALE);
    rg.addColorStop(0, 'rgba(0,0,0,0)'); rg.addColorStop(1, 'rgba(2,8,6,.82)');
    ctx.fillStyle = rg; ctx.fillRect(0, 0, VW, VH);
  }
  // rain
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (ch.rain && !(lampLit > 1.5)) {
    ctx.strokeStyle = 'rgba(190,210,240,.28)'; ctx.lineWidth = 1;
    ctx.beginPath();
    for (const d of rain) {
      d.y += d.s * (1 / 60); d.x -= d.s * .15 / 60;
      if (d.y > VH) { d.y = -20; d.x = rand(VW + 100); }
      ctx.moveTo(d.x, d.y); ctx.lineTo(d.x - d.l * .15, d.y + d.l);
    }
    ctx.stroke();
  }
  if (lampLit > 0) {
    ctx.fillStyle = `rgba(255,214,150,${clamp(.35 - Math.abs(lampLit - .6) * .4, 0, .35)})`; ctx.fillRect(0, 0, VW, VH);
  }
  if (endingTimer > 1.6) { ctx.fillStyle = `rgba(14,20,36,${clamp((endingTimer - 1.6) / 1.4, 0, 1)})`; ctx.fillRect(0, 0, VW, VH); }

  drawHUD();
  if (state === 'dialog' && dialog) drawDialog();
}

function drawBackground() {
  const ch = CHAPTERS[chapter];
  for (const L of bgLayers) {
    if (L.kind === 'city') {
      const base = VH * .92 - (cam.y - (lvl.h * T - viewH())) * L.f * SCALE * .3;
      for (const b of L.items) {
        const x = (b.x - cam.x * L.f) * SCALE, w = b.w * SCALE, h = b.h * SCALE;
        if (x > VW || x + w < 0) continue;
        ctx.fillStyle = L.col; ctx.fillRect(x, base - h, w, h + VH);
        if (b.roof === 'peak') { ctx.beginPath(); ctx.moveTo(x, base - h); ctx.lineTo(x + w / 2, base - h - 22 * SCALE); ctx.lineTo(x + w, base - h); ctx.fill(); }
        if (b.roof === 'chimney') ctx.fillRect(x + w * .7, base - h - 16 * SCALE, 8 * SCALE, 16 * SCALE);
        ctx.fillStyle = ch.lanterns ? 'rgba(255,190,100,.55)' : 'rgba(255,210,140,.35)';
        b.wins.forEach((on, i) => { if (on) ctx.fillRect(x + (8 + (i % 3) * 14) * SCALE, base - h + (14 + ((i / 3) | 0) * 22) * SCALE, 6 * SCALE, 8 * SCALE); });
      }
    } else if (L.kind === 'arches') {
      ctx.strokeStyle = L.col; ctx.lineWidth = 14 * SCALE;
      const span = 220 * SCALE, off = -(cam.x * L.f * SCALE) % span;
      for (let x = off - span; x < VW + span; x += span) {
        ctx.beginPath(); ctx.arc(x + span / 2, VH * .75, span * .45, Math.PI, 0); ctx.stroke();
        ctx.fillStyle = L.col; ctx.fillRect(x + span * .05 - 7 * SCALE, VH * .75, 14 * SCALE, VH);
      }
    } else if (L.kind === 'pipes') {
      for (const p of L.items) {
        const x = (p.x - cam.x * L.f) * SCALE;
        if (x < -40 || x > VW + 40) continue;
        ctx.fillStyle = L.col; ctx.fillRect(x, 0, p.w * SCALE, VH);
        ctx.fillRect(x - 4 * SCALE, p.y * SCALE, (p.w + 8) * SCALE, 10 * SCALE);
        ctx.fillStyle = 'rgba(120,200,170,.08)'; ctx.fillRect(x + 2 * SCALE, 0, 2 * SCALE, VH);
      }
    } else if (L.kind === 'gears') {
      for (const gr of L.items) {
        const x = (gr.x - cam.x * L.f) * SCALE, y = (gr.y - cam.y * L.f) * SCALE;
        if (y < -200 || y > VH + 200) continue;
        drawGear(x, y, gr.r * SCALE, gr.teeth, now * gr.sp, 'rgba(90,64,40,.55)');
      }
      // clock face window
      const cx = VW * .5 - cam.x * .1 * SCALE, cy = (500 - cam.y * .25) * SCALE;
      ctx.fillStyle = 'rgba(240,220,170,.12)'; ctx.beginPath(); ctx.arc(cx, cy, 120 * SCALE, 0, 7); ctx.fill();
      ctx.strokeStyle = 'rgba(240,220,170,.25)'; ctx.lineWidth = 4 * SCALE;
      ctx.beginPath(); ctx.arc(cx, cy, 120 * SCALE, 0, 7); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(now * .2) * 90 * SCALE, cy + Math.sin(now * .2) * 90 * SCALE);
      ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(now * .02 - 1) * 60 * SCALE, cy + Math.sin(now * .02 - 1) * 60 * SCALE); ctx.stroke();
    }
  }
}

function drawGear(x, y, r, teeth, a, col) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(a); ctx.fillStyle = col;
  ctx.beginPath();
  for (let i = 0; i < teeth * 2; i++) {
    const rr = i % 2 ? r : r * 1.15, an = i / (teeth * 2) * Math.PI * 2;
    ctx.lineTo(Math.cos(an) * rr, Math.sin(an) * rr);
  }
  ctx.closePath(); ctx.fill();
  ctx.globalCompositeOperation = 'destination-out';
  ctx.beginPath(); ctx.arc(0, 0, r * .35, 0, 7); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';
  ctx.restore();
}

function drawWater(sx, sy) {
  const pal = CHAPTERS[chapter].pal;
  const x0 = Math.max(0, Math.floor(sx / T)), x1 = Math.min(lvl.w - 1, Math.ceil((sx + viewW()) / T));
  const y0 = Math.max(0, Math.floor(sy / T)), y1 = Math.min(lvl.h - 1, Math.ceil((sy + viewH()) / T));
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    if (lvl.g[y][x] !== '~') continue;
    const top = y === 0 || lvl.g[y - 1][x] !== '~';
    ctx.fillStyle = rgb(pal.water, .92); ctx.fillRect(x * T, y * T, T, T);
    if (top) {
      const wv = Math.sin(now * 2.4 + x * .9) * 2;
      ctx.fillStyle = rgb(pal.water.map(n => n + 70), .9); ctx.fillRect(x * T, y * T + 6 + wv, T, 3);
      ctx.fillStyle = 'rgba(0,0,0,0)';
      ctx.clearRect(0, 0, 0, 0);
      ctx.fillStyle = rgb(CHAPTERS[chapter].pal.water.map(n => n - 10), 1);
      ctx.fillRect(x * T, y * T, T, 6 + wv);
      // repaint sky band behind water surface is not needed; cover with darker band to read as surface
      ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.fillRect(x * T + ((now * 30 + x * 13) % T), y * T + 12, 6, 1);
    }
  }
}

function drawPlat(p) {
  if (p.kind === 'gear') {
    drawGear(p.x + p.w / 2, p.y + 18, 22, 10, p.ph * 2, '#7a5a34');
    ctx.fillStyle = '#c9a25a'; ctx.fillRect(p.x, p.y, p.w, 8);
    ctx.fillStyle = '#f0cf86'; ctx.fillRect(p.x, p.y, p.w, 2);
  } else {
    ctx.fillStyle = '#6e4a2a'; ctx.fillRect(p.x, p.y, p.w, 12);
    ctx.fillStyle = '#9a6a3c'; for (let i = 0; i < 3; i++) ctx.fillRect(p.x + i * T + 1, p.y, T - 2, 9);
    ctx.fillStyle = '#c08a52'; ctx.fillRect(p.x, p.y, p.w, 2);
    if (p.kind === 'lift') { ctx.strokeStyle = 'rgba(200,200,210,.5)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(p.x + 8, p.y); ctx.lineTo(p.x + 8, 0); ctx.moveTo(p.x + p.w - 8, p.y); ctx.lineTo(p.x + p.w - 8, 0); ctx.stroke(); }
  }
}

function drawStamp(x, y) {
  ctx.fillStyle = '#f3ead8'; ctx.fillRect(x - 8, y - 9, 16, 18);
  ctx.fillStyle = '#d6453d'; ctx.fillRect(x - 6, y - 7, 12, 14);
  ctx.fillStyle = '#f3ead8'; ctx.fillRect(x - 3, y - 4, 6, 5); ctx.fillRect(x - 4, y + 2, 8, 2);
  ctx.fillStyle = 'rgba(243,234,216,1)';
  for (let i = -8; i < 8; i += 4) { ctx.clearRect; ctx.fillRect(x + i + 1, y - 10, 2, 1); ctx.fillRect(x + i + 1, y + 9, 2, 1); }
}

function drawProp(pr) {
  if (pr.type === 'mailbox') {
    ctx.fillStyle = '#2a2433'; ctx.fillRect(pr.x - 2, pr.y - 12, 4, 12);
    ctx.fillStyle = '#d6453d'; ctx.fillRect(pr.x - 10, pr.y - 34, 20, 24);
    ctx.fillStyle = '#a8322c'; ctx.fillRect(pr.x - 10, pr.y - 14, 20, 4);
    ctx.fillStyle = '#2a2433'; ctx.fillRect(pr.x - 6, pr.y - 28, 12, 3);
    ctx.fillStyle = '#e2b45a'; ctx.fillRect(pr.x - 11, pr.y - 37, 22, 4);
    ctx.fillStyle = pr.on ? '#e2b45a' : '#555';
    const fy = pr.on ? -44 : -30;

function drawLighthouse(pr) {

    ctx.beginPath(); ctx.moveTo(x - w1, y1); ctx.lineTo(x - w2, y2); ctx.lineTo(x + w2, y2); ctx.lineTo(x + w1, y1); ctx.fill();
  }

  ctx.fillStyle = '#3a2a22'; ctx.fillRect(x - 12, base - 40, 24, 40);

function drawBoss(B) {

// ---------- HUD & dialog ----------
function drawHUD() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (state === 'title' || !P) return;
  const sl = Math.max(16, inset('paddingLeft')), st = 14 + inset('paddingTop');
  // battery cells
  for (let i = 0; i < 3; i++) {
    const x = sl + i * 30, y = st;
    ctx.fillStyle = 'rgba(14,20,36,.6)'; ctx.fillRect(x - 2, y - 2, 26, 16);
    ctx.fillStyle = '#f3ead8'; ctx.fillRect(x, y, 22, 12); ctx.fillRect(x + 22, y + 3, 3, 6);
    ctx.fillStyle = i < P.hp ? (P.hp === 1 ? '#d6453d' : '#7fd1c7') : '#2a2433';
    ctx.fillRect(x + 2, y + 2, 18, 8);
  }
  ctx.font = '600 15px "Pixelify Sans", monospace'; ctx.textBaseline = 'top'; ctx.fillStyle = '#f3ead8';
  ctx.fillText(`Ch. ${chapter + 1} · ${CHAPTERS[chapter].title}`, sl, st + 20);
  if (hasDJ) { ctx.font = '12px "Pixelify Sans", monospace'; ctx.fillStyle = '#e2b45a'; ctx.fillText('Spring Heels', sl, st + 40); }
  // stamps
  const sr = VW - Math.max(16, inset('paddingRight')) - (touch.used ? 50 : 0);
  ctx.textAlign = 'right'; ctx.font = '600 18px "Pixelify Sans", monospace'; ctx.fillStyle = '#f3ead8';
  ctx.fillText(`${collected.size}/${TOTAL_STAMPS}`, sr, st);
  ctx.save(); ctx.translate(sr - ctx.measureText(`${collected.size}/${TOTAL_STAMPS}`).width - 16, st + 9); ctx.scale(.8, .8); drawStamp(0, 0); ctx.restore();
  ctx.textAlign = 'left';
  // boss bar
  if (boss && boss.state !== 'sleep' && boss.state !== 'dead') {
    ctx.textAlign = 'center'; ctx.font = '600 15px "Pixelify Sans", monospace'; ctx.fillStyle = '#f07a3e';
    ctx.fillText('THE DREDGER', VW / 2, st + 2);
    for (let i = 0; i < 3; i++) { ctx.fillStyle = i < boss.hp ? '#f07a3e' : 'rgba(243,234,216,.2)'; ctx.fillRect(VW / 2 - 52 + i * 36, st + 22, 32, 6); }
    ctx.textAlign = 'left';
  }
  // touch controls
  if (touch.used && state === 'play') {
    const btn = touchButtons(), ts = touchState();
    for (const [k, lab] of [['left', '◀'], ['right', '▶'], ['jump', 'JUMP']]) {
      const b = btn[k];
      ctx.fillStyle = ts[k] ? 'rgba(226,180,90,.35)' : 'rgba(243,234,216,.12)';
      ctx.strokeStyle = 'rgba(243,234,216,.45)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#f3ead8'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = `600 ${k === 'jump' ? 15 : 20}px "Pixelify Sans", monospace`; ctx.fillText(lab, b.x, b.y);
    }
    const pb = btn.pause; ctx.fillStyle = 'rgba(243,234,216,.7)'; ctx.fillRect(pb.x - 7, pb.y - 9, 5, 18); ctx.fillRect(pb.x + 2, pb.y - 9, 5, 18);
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  }
}

function wrap(text, maxW) {
  const words = text.split(' '), lines = []; let line = '';
  for (const w of words) { const t = line ? line + ' ' + w : w; if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t; }
  if (line) lines.push(line); return lines;
}
function drawDialog() {
  const l = dialog.lines[dialog.i]; if (!l) return;
  const [who, text] = l, sp = SPEAKERS[who];
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const sb = inset('paddingBottom'), sl = Math.max(16, inset('paddingLeft')), sr = Math.max(16, inset('paddingRight'));
  const W = Math.min(680, VW - sl - sr), x = (VW - W) / 2 + (sl - sr) / 2;
  const hasPortrait = who !== 'sys';
  const pad = 16, pw = hasPortrait ? 76 : 0;

  const shown = text.slice(0, Math.floor(dialog.chars));
  const lines = wrap(text, W - pad * 2 - pw);
  const H = Math.max(hasPortrait ? 98 : 60, 46 + lines.length * 23);
  const y = VH - H - 16 - sb;
  ctx.fillStyle = 'rgba(14,20,36,.92)'; ctx.fillRect(x, y, W, H);
  ctx.strokeStyle = sp.color; ctx.lineWidth = 2; ctx.strokeRect(x + 1, y + 1, W - 2, H - 2);
  if (hasPortrait) {
    ctx.fillStyle = '#1d2b45'; ctx.fillRect(x + pad, y + pad, 60, 60);
    ctx.save(); ctx.beginPath(); ctx.rect(x + pad, y + pad, 60, 60); ctx.clip();
    ctx.translate(x + pad + 30, y + pad + 58);
    const sc = who === 'pip' ? 1.7 : who === 'wren' || who === 'marrow' ? 2 : who === 'dredger' ? .9 : 1.15;
    ctx.scale(sc, sc);
    if (who === 'pip') drawPip(0, 0, 1, 0);
    else if (who === 'dredger') drawDredgerShape(10, 0, -1, 'idle', now);
    else drawCharacter(who, 0, 0, 1, now);
    ctx.restore();
  }
  const tx = x + pad + pw;
  let ty = y + pad - 2;
  if (sp.name) { ctx.font = '600 15px "Pixelify Sans", monospace'; ctx.fillStyle = sp.color; ctx.textBaseline = 'top'; ctx.fillText(sp.name, tx, ty); ty += 22; }
  ctx.font = (who === 'sys' ? 'italic ' : '') + '17px "Gentium Book Plus", Georgia, serif';
  ctx.fillStyle = who === 'sys' ? '#e2b45a' : '#f3ead8'; ctx.textBaseline = 'top';
  let remaining = shown.length;
  for (const ln of lines) {
    if (remaining <= 0) break;
    ctx.fillText(ln.slice(0, remaining), tx, ty);
    remaining -= ln.length + 1; ty += 23;
  }
  if (dialog.chars >= text.length && Math.floor(now * 3) % 2) {
    ctx.fillStyle = sp.color; ctx.font = '600 13px "Pixelify Sans", monospace'; ctx.textAlign = 'right';
    ctx.fillText(touch.used ? 'tap ▸' : 'space ▸', x + W - 12, y + H - 20); ctx.textAlign = 'left';
  }
}

// ============================================================
// Screens
// ============================================================
const screen = document.getElementById('screen'), card = document.getElementById('card');
function show(html, actions) {
  card.innerHTML = html; screen.hidden = false;
  const row = document.createElement('div'); row.className = 'row';
  for (const [label, fn, ghost] of actions) {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = label;
    if (ghost) b.className = 'ghost';
    b.addEventListener('click', () => { initAudio(); fn(); });
    row.appendChild(b);
  }
  card.appendChild(row);
  const f = row.querySelector('button'); if (f) f.focus({ preventScroll: true });
}
const hide = () => { screen.hidden = true; };
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

function titleScreen() {
  state = 'title';
  const bl = best ? `<p class="quiet">Best round: ${best.stamps}/${TOTAL_STAMPS} stamps in ${fmt(best.time)}.</p>` : '';
  show(`
    <div class="postmark"><span>Saltmere · Last post</span><span>A story in five chapters</span></div>
    <h1>Saltmere Post</h1>
    <p>The town is sinking, the ferry is leaving, and there is one letter left in the sack. You are Pip, the post office's last courier automaton, and the letter is going to be delivered.</p>
    <dl class="controls">
      <dt>Move</dt><dd>← → or A D</dd>
      <dt>Jump</dt><dd>Space, W or ↑ (hold for higher)</dd>
      <dt>Drop</dt><dd>↓ or S through wooden planks</dd>
      <dt>Talk</dt><dd>Space or Enter to continue</dd>
      <dt>Pause</dt><dd>P or Esc · M mutes</dd>
    </dl>
    <p class="quiet">On a phone, on-screen buttons appear once you touch the game.</p>
    ${bl}`, [['Start the round', () => { collected = new Set(); deaths = 0; playTime = 0; hasDJ = false; chapterCard(0); }]]);
}

function chapterCard(i) {
  state = 'card';
  loadChapter(i);
  const c = CHAPTERS[i];
  if (i >= 2) hasDJ = true;
  show(`
    <div class="postmark"><span>Chapter ${['One', 'Two', 'Three', 'Four', 'Five'][i]}</span><span>${collected.size}/${TOTAL_STAMPS} stamps</span></div>
    <h2>${c.title}</h2>
    <p>${c.card}</p>
    ${c.card2 ? `<p>${c.card2}</p>` : ''}`, [[i === 0 ? 'Pick up the satchel' : 'Continue the round', play]]);
}
function play() { state = 'play'; hide(); last = performance.now(); }
function pause() {
  if (state !== 'play') return;
  state = 'pause';
  show(`<div class="postmark"><span>Paused</span><span>Ch. ${chapter + 1}</span></div><h2>${CHAPTERS[chapter].title}</h2>
    <p class="quiet">Stamps ${collected.size}/${TOTAL_STAMPS} · Time ${fmt(playTime)} · Short circuits ${deaths} · Sound ${muted ? 'off' : 'on'}</p>`,
    [['Resume', resume], [muted ? 'Sound on' : 'Sound off', () => { muted = !muted; state = 'play'; pause(); }, true], ['Back to title', titleScreen, true]]);
}
function resume() { state = 'play'; hide(); last = performance.now(); }

function finishChapter() {
  if (chapter >= 4) return;
  if (chapter === 1) hasDJ = true;
  chapterCard(chapter + 1);
}

function showEnding() {
  state = 'end';
  const all = collected.size >= TOTAL_STAMPS;
  const rec = { stamps: collected.size, time: playTime };
  if (!best || rec.stamps > best.stamps || (rec.stamps === best.stamps && rec.time < best.time)) {
    best = rec; try { localStorage.setItem('saltmere-best', JSON.stringify(best)); } catch (e) { /* storage unavailable */ }
  }
  show(`
    <div class="postmark"><span>Delivered</span><span>Saltmere Light · dawn</span></div>
    <h2>The Light at Saltmere</h2>
    <p>The Saltmere Light burned all night. Just before dawn, the last ferry felt its way through the shoals by its beam, and the first person off the gangway was a young woman with her mother's chin.</p>
    <p>Odile was already waiting on the jetty. Tobble came down from the hills to wave. Wren got chips.</p>
    <p class="sign">Pip waited, very politely, until everyone had finished crying, and then asked for a signature.</p>
    ${all ? '<p class="quiet">You found every stamp. Odile pinned all twenty-five over the lamp-room door.</p>' : `<p class="quiet">${TOTAL_STAMPS - collected.size} stamps are still out there in the rain.</p>`}
    <div class="stats">
      <div><span>Stamps</span><b>${collected.size}/${TOTAL_STAMPS}</b></div>
      <div><span>Time</span><b>${fmt(playTime)}</b></div>
      <div><span>Short circuits</span><b>${deaths}</b></div>
    </div>`, [['Deliver it again', titleScreen]]);
}

// ============================================================
// Loop
// ============================================================
let last = performance.now();
function frame(t) {
  const dt = Math.min(1 / 30, (t - last) / 1000); last = t;
  if (state === 'play') update(dt);
  else if (state === 'dialog') {
    now += dt;
    const l = dialog && dialog.lines[dialog.i];
    if (l) { const before = Math.floor(dialog.chars); dialog.chars = Math.min(l[1].length, dialog.chars + dt * 55); if (Math.floor(dialog.chars) > before && Math.floor(dialog.chars) % 3 === 0) sfx.blip(); }
    for (const q of particles) { q.vy += q.grav * dt; q.x += q.vx * dt; q.y += q.vy * dt; q.life -= dt; }
    particles = particles.filter(q => q.life > 0);
    if (lampLit > 0) lampLit += dt;
  } else now += dt;
  render();
  requestAnimationFrame(frame);
}

// debug/test hook (read-only data)
window.__saltmere = { LEVELS, goto: i => { hasDJ = i >= 2; chapterCard(i); }, get state() { return state; }, get player() { return P; }, get boss() { return boss; } };

loadChapter(0);
titleScreen();
requestAnimationFrame(frame);
})();
</script>
